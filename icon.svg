<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Game studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16202e"/>
      <stop offset="1" stop-color="#0b1017"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ad2c4"/>
      <stop offset="1" stop-color="#3b8ff0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="96" height="96" rx="22" fill="url(#bg)"/>
  <!-- clapper base -->
  <rect x="18" y="44" width="60" height="34" rx="6" fill="#1e2b3c" stroke="#3c5169" stroke-width="2"/>
  <!-- clapper top with slanted stripes -->
  <g transform="rotate(-8 48 34)">
    <rect x="16" y="24" width="64" height="14" rx="4" fill="url(#slate)"/>
    <path d="M26 24 L34 38 M44 24 L52 38 M62 24 L70 38" stroke="#0b1017" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  </g>
  <!-- stage gate marks -->
  <g fill="#7fe7c4">
    <rect x="26" y="54" width="16" height="5" rx="2.5"/>
    <rect x="26" y="64" width="26" height="5" rx="2.5" opacity="0.7"/>
  </g>
  <!-- play triangle -->
  <path d="M58 54 L74 63 L58 72 Z" fill="#f2c14e"/>
</svg>
